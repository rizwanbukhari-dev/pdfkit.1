<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="application-name" content="PDFKit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PDFKit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="PDFKit is an online all-in-one PDF utility platform. Merge, split, compress, convert, edit and manage your PDFs securely inside your browser." />
    <meta name="keywords" content="PDF, merge pdf, split pdf, compress pdf, convert pdf, sign pdf, watermark pdf, client-side, free pdf tools" />
    <meta property="og:title" content="PDFKit — Everything You Need to Work With PDFs" />
    <meta property="og:description" content="Merge, split, compress, convert, edit and manage your PDFs with simple and powerful tools." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Early capture of beforeinstallprompt before React scripts finish evaluating
      window.__PDFKIT_INSTALL_EVENT__ = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__PDFKIT_INSTALL_EVENT__ = e;
        window.dispatchEvent(new CustomEvent('pdfkit-install-ready'));
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <title>PDFKit — Everything You Need to Work With PDFs</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('pdfkit-theme') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var color = localStorage.getItem('pdfkit-accent-color') || 'indigo';
          document.documentElement.setAttribute('data-theme-color', color);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
